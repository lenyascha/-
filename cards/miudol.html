<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>МИУДОЛ — Отдел внешнего взаимодействия</title>
<style>
@font-face {
  font-family: 'Montserrat';
  font-weight: 700;
  src: url('fonts/Montserrat-Bold.ttf') format('truetype');
}
@font-face {
  font-family: 'Montserrat';
  font-weight: 800;
  src: url('fonts/Montserrat-ExtraBold.ttf') format('truetype');
}
@font-face {
  font-family: 'Montserrat';
  font-weight: 900;
  src: url('fonts/Montserrat-Black.ttf') format('truetype');
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#111; }
.slide {
  position: relative;
  width: 1920px;
  height: 1080px;
  overflow: hidden;
  font-family: 'Montserrat', sans-serif;
  background: #050716;
}
.dot-grid {
  position: absolute;
  inset: 0;
  background-image: radial-gradient(rgba(120,150,220,0.28) 1.6px, transparent 1.6px);
  background-size: 34px 34px;
  background-position: -10px -10px;
  -webkit-mask-image: linear-gradient(120deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.9) 30%, rgba(0,0,0,0.2) 65%, rgba(0,0,0,0) 100%);
  mask-image: linear-gradient(120deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.9) 30%, rgba(0,0,0,0.2) 65%, rgba(0,0,0,0) 100%);
}
.glow {
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
}
.glow-header {
  top: -260px;
  right: -160px;
  width: 900px;
  height: 900px;
  background: radial-gradient(circle, rgba(90,80,220,0.35) 0%, rgba(60,50,160,0.12) 45%, transparent 72%);
}
.glow-logo {
  top: -120px;
  left: -160px;
  width: 560px;
  height: 560px;
  background: radial-gradient(circle, rgba(80,70,200,0.28) 0%, transparent 70%);
}
.glow-dot {
  position: absolute;
  bottom: -70px;
  width: 240px;
  height: 240px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(70,140,255,0.5) 0%, transparent 70%);
}
.glow-dot.c1 { left: calc(16.66% - 120px); }
.glow-dot.c2 { left: calc(50% - 120px); }
.glow-dot.c3 { left: calc(83.33% - 120px); }

.logo {
  position: absolute;
  top: 44px;
  left: 48px;
  display: flex;
  align-items: center;
  gap: 22px;
  z-index: 2;
}
.logo-mark { width: 92px; height: 92px; }
.logo-text {
  color: #ffffff;
  font-weight: 800;
  font-size: 34px;
  letter-spacing: 1px;
}

.header-divider {
  position: absolute;
  top: 46px;
  left: 328px;
  width: 2px;
  height: 210px;
  background: linear-gradient(180deg, rgba(120,160,255,0), rgba(120,160,255,0.55) 40%, rgba(120,160,255,0.55) 60%, rgba(120,160,255,0));
  z-index: 2;
}

.header-text {
  position: absolute;
  top: 58px;
  left: 370px;
  max-width: 940px;
  z-index: 2;
}
.title {
  color: #ffffff;
  font-weight: 800;
  font-size: 50px;
  line-height: 1.28;
}
.subtitle {
  margin-top: 20px;
  color: #a9b6e8;
  font-weight: 700;
  font-size: 27px;
  letter-spacing: 0.5px;
}

.header-icon {
  position: absolute;
  top: 18px;
  right: 74px;
  width: 560px;
  height: 330px;
  z-index: 2;
}

.columns {
  position: absolute;
  top: 388px;
  left: 0;
  right: 0;
  display: flex;
  z-index: 2;
}
.col {
  position: relative;
  flex: 1 1 0;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.col-divider {
  position: absolute;
  top: 10px;
  bottom: -60px;
  width: 2px;
  background: linear-gradient(180deg, rgba(110,150,255,0), rgba(110,150,255,0.4) 30%, rgba(110,150,255,0.4) 70%, rgba(110,150,255,0));
  z-index: 1;
}
.col-divider.d1 { left: 33.33%; }
.col-divider.d2 { left: 66.66%; }

.circle {
  width: 232px;
  height: 232px;
  border-radius: 50%;
  padding: 2.5px;
  background: linear-gradient(135deg, #7c6cf0, #4dd0fa);
  box-shadow: 0 0 34px rgba(90,110,255,0.14);
}
.circle-inner {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background: radial-gradient(circle at 50% 38%, #171335 0%, #0c0a22 62%, #07061a 100%);
  display: flex;
  align-items: center;
  justify-content: center;
}
.circle .icon { width: 96px; height: 96px; }

.caption {
  margin-top: 46px;
  color: #ffffff;
  font-weight: 800;
  font-size: 27px;
  line-height: 1.5;
  text-align: center;
  max-width: 480px;
  letter-spacing: 0.3px;
}

.connector {
  position: relative;
  width: 2px;
  height: 150px;
  margin-top: 40px;
  background: linear-gradient(180deg, rgba(90,130,255,0.75), rgba(90,130,255,0.05));
}
.connector .ring {
  position: absolute;
  left: 50%;
  bottom: -20px;
  transform: translateX(-50%);
  border-radius: 50%;
  border: 1.5px solid rgba(110,160,255,0.35);
}
.connector .ring.r1 { width: 40px; height: 40px; bottom: -18px; }
.connector .ring.r2 { width: 74px; height: 74px; bottom: -35px; }
.connector .dot {
  position: absolute;
  left: 50%;
  bottom: -10px;
  transform: translateX(-50%);
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 32%, #cfe4ff, #3a7bff);
  box-shadow: 0 0 22px 8px rgba(58,123,255,0.55);
}

.icon {
  stroke: #ffffff;
  stroke-width: 1.5;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}
svg.defs { position:absolute; width:0; height:0; }
</style>
</head>
<body>
<svg class="defs"><defs>
<linearGradient id="grad-logo1" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#8b5cf6"/>
  <stop offset="100%" stop-color="#5b6cf0"/>
</linearGradient>
<linearGradient id="grad-logo2" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#3ab6f0"/>
  <stop offset="100%" stop-color="#3fd0e8"/>
</linearGradient>

<symbol id="icon-laptop-globe" viewBox="0 0 96 96">
  <rect x="10" y="14" width="52" height="38" rx="2.5"/>
  <path d="M4 60h64l-6 8H10l-6-8z"/>
  <circle cx="36" cy="33" r="15"/>
  <path d="M21 33h30M36 18a22 22 0 010 30M36 18a22 22 0 000 30"/>
  <path d="M27 22c3 3 3 20 0 22M45 22c-3 3-3 20 0 22" opacity="0"/>
  <g>
    <rect x="58" y="40" width="30" height="24" rx="2" fill="#0c0a22" stroke="#ffffff"/>
    <path d="M64 47h18M64 53h18M64 59h10"/>
  </g>
</symbol>

<symbol id="icon-doc-chart" viewBox="0 0 96 96">
  <rect x="18" y="8" width="48" height="60" rx="3"/>
  <path d="M28 42v16M40 34v24M52 46v12" stroke-width="3.4"/>
  <circle cx="70" cy="24" r="18" fill="#0c0a22" stroke="#ffffff"/>
  <path d="M70 24V9a15 15 0 0115 15h-15z" fill="#ffffff" stroke="none"/>
</symbol>

<symbol id="icon-doc-edit" viewBox="0 0 96 96">
  <rect x="16" y="8" width="52" height="66" rx="3"/>
  <path d="M26 24h32M26 34h32M26 44h24M26 54h18"/>
  <path d="M58 68l24-24 8 8-24 24H58v-8z" fill="#0c0a22" stroke="#ffffff"/>
</symbol>

<symbol id="icon-people-m" viewBox="0 0 100 60">
  <circle cx="26" cy="16" r="13" fill="url(#grad-logo1)"/>
  <path d="M4 58c0-16 10-28 22-28s22 12 22 28" fill="url(#grad-logo1)"/>
  <circle cx="74" cy="16" r="13" fill="url(#grad-logo2)"/>
  <path d="M52 58c0-16 10-28 22-28s22 12 22 28" fill="url(#grad-logo2)"/>
</symbol>

<symbol id="icon-search-dashboard" viewBox="0 0 200 118">
  <g>
    <circle cx="68" cy="52" r="46" fill="none" stroke="url(#grad-logo1)" stroke-width="5"/>
    <line x1="100" y1="84" x2="132" y2="116" stroke="url(#grad-logo1)" stroke-width="9" stroke-linecap="round"/>
    <path d="M46 66V44M60 66V32M74 66V50M88 66V38" stroke="url(#grad-logo2)" stroke-width="6"/>
  </g>
  <g>
    <rect x="112" y="10" width="82" height="58" rx="4" fill="#0c0a22" stroke="#5fa8ff" stroke-width="2.5"/>
    <path d="M112 78h82l-8 10h-66l-8-10z" fill="#0c0a22" stroke="#5fa8ff" stroke-width="2.5"/>
    <rect x="122" y="20" width="26" height="20" rx="2" fill="none" stroke="#5fa8ff" stroke-width="2"/>
    <circle cx="129" cy="27" r="3" fill="none" stroke="#5fa8ff" stroke-width="1.8"/>
    <path d="M123 37l6-7 5 5 6-8 6 10" fill="none" stroke="#5fa8ff" stroke-width="1.8"/>
    <rect x="154" y="20" width="30" height="20" rx="2" fill="none" stroke="#5fa8ff" stroke-width="2"/>
    <path d="M162 40V26M170 40V20M178 40V32" stroke="#5fa8ff" stroke-width="2.2"/>
  </g>
</symbol>
</defs></svg>

  <div class="slide">
    <div class="dot-grid"></div>
    <div class="glow glow-header"></div>
    <div class="glow glow-logo"></div>
    <div class="glow-dot c1"></div>
    <div class="glow-dot c2"></div>
    <div class="glow-dot c3"></div>

    <div class="logo">
      <svg class="logo-mark" viewBox="0 0 100 60"><use href="#icon-people-m"/></svg>
      <div class="logo-text">МИУДОЛ</div>
    </div>

    <div class="header-divider"></div>

    <div class="header-text">
      <div class="title">Главный специалист-эксперт,<br>консультант</div>
      <div class="subtitle">Отдел внешнего взаимодействия</div>
    </div>

    <div class="header-icon"><svg viewBox="0 0 200 118" style="width:100%;height:100%;"><use href="#icon-search-dashboard"/></svg></div>

    <div class="col-divider d1"></div>
    <div class="col-divider d2"></div>

    <div class="columns">
      <div class="col">
        <div class="circle"><div class="circle-inner"><svg class="icon" viewBox="0 0 96 96"><use href="#icon-laptop-globe"/></svg></div></div>
        <div class="caption">МЕДИА-МОНИТОРИНГ<br>СМИ, ИНТЕРНЕТ-РЕСУРСОВ<br>И СОЦИАЛЬНЫХ МЕДИА</div>
        <div class="connector">
          <div class="ring r2"></div>
          <div class="ring r1"></div>
          <div class="dot"></div>
        </div>
      </div>
      <div class="col">
        <div class="circle"><div class="circle-inner"><svg class="icon" viewBox="0 0 96 96"><use href="#icon-doc-chart"/></svg></div></div>
        <div class="caption">ПОДГОТОВКА<br>АНАЛИТИЧЕСКИХ СПРАВОК<br>И ОТЧЁТОВ ПО РЕЗУЛЬТАТАМ<br>МЕДИА-МОНИТОРИНГА</div>
        <div class="connector">
          <div class="ring r2"></div>
          <div class="ring r1"></div>
          <div class="dot"></div>
        </div>
      </div>
      <div class="col">
        <div class="circle"><div class="circle-inner"><svg class="icon" viewBox="0 0 96 96"><use href="#icon-doc-edit"/></svg></div></div>
        <div class="caption">ПОДГОТОВКА, РЕДАКТИРОВАНИЕ<br>И СОГЛАСОВАНИЕ МАТЕРИАЛОВ<br>ДЛЯ ПУБЛИКАЦИИ</div>
        <div class="connector">
          <div class="ring r2"></div>
          <div class="ring r1"></div>
          <div class="dot"></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
